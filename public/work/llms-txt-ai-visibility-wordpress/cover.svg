<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#1a0408"/>
      <stop offset="55%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="cardEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="softSm" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>

  <!-- ambient network / crawler graph, low opacity -->
  <g stroke="#00E5FF" stroke-opacity="0.16" stroke-width="1.5">
    <line x1="120" y1="160" x2="330" y2="260"/>
    <line x1="330" y1="260" x2="300" y2="440"/>
    <line x1="1260" y1="150" x2="1440" y2="240"/>
    <line x1="1440" y1="240" x2="1480" y2="420"/>
    <line x1="1300" y1="760" x2="1460" y2="700"/>
    <line x1="200" y1="740" x2="340" y2="820"/>
    <line x1="340" y1="820" x2="260" y2="900"/>
  </g>
  <g fill="#00E5FF" fill-opacity="0.55">
    <circle cx="120" cy="160" r="4"/>
    <circle cx="330" cy="260" r="5"/>
    <circle cx="300" cy="440" r="3.5"/>
    <circle cx="1260" cy="150" r="4"/>
    <circle cx="1440" cy="240" r="5"/>
    <circle cx="1480" cy="420" r="3.5"/>
    <circle cx="1300" cy="760" r="4"/>
    <circle cx="1460" cy="700" r="3.5"/>
    <circle cx="200" cy="740" r="4"/>
    <circle cx="340" cy="820" r="5"/>
    <circle cx="260" cy="900" r="3.5"/>
  </g>

  <!-- 404 badge -->
  <rect x="72" y="72" width="64" height="64" fill="#D6001C"/>
  <text x="104" y="114" font-family="Arial" font-size="26" font-weight="800" fill="#ffffff" text-anchor="middle">404</text>

  <!-- glow behind the terminal card -->
  <ellipse cx="800" cy="470" rx="420" ry="230" fill="#D6001C" fill-opacity="0.10" filter="url(#soft)"/>

  <!-- terminal / txt-file card -->
  <g>
    <rect x="440" y="270" width="720" height="400" rx="18" fill="#0d0d12" stroke="url(#cardEdge)" stroke-width="1.5"/>
    <rect x="440" y="270" width="720" height="56" rx="18" fill="#111116"/>
    <rect x="440" y="308" width="720" height="18" fill="#111116"/>

    <!-- window dots -->
    <circle cx="474" cy="298" r="6" fill="#D6001C"/>
    <circle cx="498" cy="298" r="6" fill="#ffffff" fill-opacity="0.35"/>
    <circle cx="522" cy="298" r="6" fill="#00E5FF"/>

    <text x="1136" y="303" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#667085" text-anchor="end" letter-spacing="1">llms.txt</text>

    <!-- body lines, mimicking real generated output -->
    <g font-family="ui-monospace, Menlo, monospace" font-size="18">
      <text x="472" y="370" fill="#ffffff" font-weight="700"># LLMs.txt</text>
      <text x="472" y="404" fill="#8a94a6">Site: 404 DAMNED</text>
      <text x="472" y="430" fill="#8a94a6">Description: Digital bureau &#8212; Amsterdam</text>
      <text x="472" y="472" fill="#00E5FF" font-weight="700">## Services</text>
      <text x="472" y="500" fill="#c6cbd6">- /services/ecommerce | Magento &amp; WooCommerce</text>
      <text x="472" y="526" fill="#c6cbd6">- /services/ai-automation | AI-automatisering</text>
      <text x="472" y="566" fill="#D6001C" font-weight="700">## Contact</text>
      <text x="472" y="594" fill="#c6cbd6">- /contact | Category Confidence: 96%</text>
      <text x="472" y="620" fill="#4a5468">Classified By: AI</text>
    </g>

    <!-- blinking-cursor style accent -->
    <rect x="472" y="628" width="10" height="18" fill="#00E5FF" fill-opacity="0.7"/>
  </g>

  <!-- title lockup -->
  <text x="800" y="800" font-family="Arial" font-weight="900" font-size="64" fill="#ffffff" text-anchor="middle" letter-spacing="1">AI VISIBILITY<tspan fill="#D6001C">.</tspan></text>
  <text x="800" y="848" font-family="ui-monospace, Menlo, monospace" font-size="20" fill="#667085" text-anchor="middle" letter-spacing="3">LLMS.TXT GENERATOR FOR WORDPRESS</text>
</svg>
